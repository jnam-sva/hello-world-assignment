<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moss widget demo</title>
    <style>
      body { margin: 0; padding: 48px 16px; font-family: Georgia, serif; background: #f6f3ec; color: #2a2833; }
      main { max-width: 720px; margin: 0 auto; }
      /* 위젯 iframe: 테두리 없이, 배경 투명 */
      .moss { display: block; width: 100%; height: 160px; border: 0; background: transparent; }
    </style>
  </head>
  <body>
    <main>
      <h1>My Portfolio</h1>
      <p>포트폴리오 페이지에 Moss를 넣은 예시예요. 마우스를 가까이 가져가거나, Moss 위에서 왔다갔다 쓰다듬어 보세요.</p>

      <!-- ▼ 이 한 줄을 포트폴리오에 붙이면 돼요 (src는 moss-widget 폴더 위치에 맞게) -->
      <iframe class="moss" src="index.html" title="Moss, a pixel cat" loading="lazy"></iframe>

      <p>아래에 다른 내용이 이어져요.</p>
    </main>
  </body>
</html>
